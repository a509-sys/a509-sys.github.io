<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pasta_bushido | Cheese Against The Macaroni</title>
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(22, 27, 34, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.14);
      --accent: #e6edf3;
      --text-muted: #8b949e;
      --highlight: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #161b22 0%, #090a0f 75%);
      color: var(--accent);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 20px 80px;
    }

    .container {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header Profile */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 104px;
      height: 104px;
      border-radius: 50%;
      border: 2px solid var(--card-border);
      object-fit: cover;
      background-color: #161b22;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .handle {
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tagline {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 440px;
    }

    /* Bento Grid */
    .bento-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 14px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      background: rgba(30, 36, 46, 0.85);
      border-color: var(--card-hover);
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
    }

    .card.full-width {
      grid-column: span 2;
    }

    .icon-box {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .icon-box svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }

    .card-title {
      font-size: 0.98rem;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .arrow {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 0.85rem;
      transition: transform 0.2s ease;
    }

    .card:hover .arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    /* Music Banner Special */
    .card-music {
      background: linear-gradient(135deg, rgba(22, 27, 34, 0.9) 0%, rgba(33, 38, 45, 0.6) 100%);
      border-color: rgba(88, 166, 255, 0.2);
    }

    .card-music:hover {
      border-color: rgba(88, 166, 255, 0.45);
    }

    @media (max-width: 480px) {
      .bento-grid {
        grid-template-columns: 1fr;
      }
      .card.full-width {
        grid-column: span 1;
      }
    }
  </style>
</head>
