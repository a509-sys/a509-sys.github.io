<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя визитка</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #e6edf3;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 460px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid #30363d;
      object-fit: cover;
    }
    .name { font-size: 1.4rem; font-weight: 600; }
    .bio { font-size: 0.95rem; color: #8b949e; text-align: center; margin-bottom: 8px; }
    .links { width: 100%; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      color: #f0f6fc;
      text-decoration: none;
      font-weight: 500;
      text-align: center;
      transition: all 0.2s ease;
    }
    .btn:hover {
      background-color: #1f242c;
      border-color: #8b949e;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="avatar" src="https://github.com/identicons/app.png" alt="Avatar">
    
    <div class="name">Твое Имя / Ник</div>
    <div class="bio">Краткое описание, профиль деятельности или статус</div>

    <div class="links">
      <a class="btn" href="https://youtube.com" target="_blank" rel="noopener">YouTube</a>
      <a class="btn" href="https://x.com" target="_blank" rel="noopener">X (Twitter)</a>
      <a class="btn" href="https://t.me" target="_blank" rel="noopener">Telegram</a>
      <a class="btn" href="mailto:example@mail.com">Связаться по почте</a>
    </div>
  </div>
</body>
</html>
