<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>самурай 🍝 макароны | @pasta_bushido</title>
  <meta name="description" content="амбассадор нулевых, конспирология и лайфстайл">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(255, 255, 255, 0.2);
      --card-hover-bg: rgba(33, 38, 45, 0.9);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, #161b22 0%, #090a0f 85%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 64px 20px 80px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    /* Header Profile */
    .profile {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      width: 100%;
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 2px solid var(--card-border);
      object-fit: cover;
      background-color: #161b22;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .title {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .bio {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.45;
      max-width: 380px;
    }

    /* Social Icons Row */
    .social-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 4px;
    }

    .social-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .social-btn:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
      color: var(--accent);
    }

    .social-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Main Links / Bento Cards */
    .content-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 18px;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      background: var(--card-hover-bg);
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
    }

    .card-thumb {
      width: 48px;
      height: 48px;
      min-width: 48px;
      border-radius: 12px;
      object-fit: cover;
      background: #1c2128;
      border: 1px solid var(--card-border);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .card-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }

    .card-arrow {
      margin-left: auto;
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .card:hover .card-arrow {
      transform: translateX(4px);
      color: var(--text-main);
    }
  </style>
</head>
